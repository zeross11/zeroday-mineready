name: Install MineReady v10 single-file mobile release

on:
  push:
    branches: [main]
    paths:
      - '.deploy-v10/READY'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mineready-v10-install
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reconstruct and verify release
        shell: bash
        run: |
          set -euo pipefail
          test -f .deploy-v10/READY
          part_count="$(find .deploy-v10 -maxdepth 1 -type f -name 'part-*' | wc -l | tr -d ' ')"
          test "${part_count}" = "42"
          cat .deploy-v10/part-* > /tmp/mineready-v10.b64
          base64 --decode /tmp/mineready-v10.b64 > /tmp/mineready-v10.tar.xz
          echo 'd46052a9de55ace62965a91bf095904ead02b62a6b0b2ac769eee760edbbf8c2  /tmp/mineready-v10.tar.xz' | sha256sum -c -
          rm -rf /tmp/mineready-v10-site
          mkdir -p /tmp/mineready-v10-site
          tar -xJf /tmp/mineready-v10.tar.xz -C /tmp/mineready-v10-site
          test -s /tmp/mineready-v10-site/index.html
          test -s /tmp/mineready-v10-site/health.json
          test "$(tr -d '\r\n' < /tmp/mineready-v10-site/CNAME)" = 'mineready.zerodaycyber.io'
          grep -q 'data-app-version="10.0.0"' /tmp/mineready-v10-site/index.html
          grep -q 'architecture": "single-file-mobile"' /tmp/mineready-v10-site/health.json
          grep -q 'service_worker": "disabled"' /tmp/mineready-v10-site/health.json
          if grep -Eq '<script[^>]+src=' /tmp/mineready-v10-site/index.html; then
            echo 'External script dependency found; refusing deployment.' >&2
            exit 1
          fi
          if grep -Eq '<link[^>]+stylesheet' /tmp/mineready-v10-site/index.html; then
            echo 'External stylesheet dependency found; refusing deployment.' >&2
            exit 1
          fi

      - name: Replace repository with clean release
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/mineready-v10-site/. .
          test -s index.html
          test -s health.json

      - name: Commit and publish main and gh-pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: deploy MineReady v10 single-file mobile build'
          git push origin HEAD:main
          git push origin HEAD:gh-pages --force
