name: Deploy MineReady to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-pages.yml'
      - '.repair/**'
      - 'index.html'
      - 'CNAME'
      - 'health.json'
      - 'manifest.webmanifest'
      - 'service-worker.js'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mineready-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified application when needed
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f index.html ]; then
            echo '1cf259f4bfd8e6b03a1cfc7a6aacb7da7d6c3c552cfc8568992fe258d0a0d050  .repair/site-00' | sha256sum -c -
            echo 'e36a8e11ff538c2ab8c0daab55307a237e0059587172e8fab691348c630c0654  .repair/site-01' | sha256sum -c -
            echo '8782ccffc66d0de5d5ca74c34c4d332d2f334149c4e126001e48c05707b42e6e  .repair/site-02' | sha256sum -c -
            cat .repair/site-00 .repair/site-01 .repair/site-02 > /tmp/mineready-site.b64
            base64 --decode /tmp/mineready-site.b64 > /tmp/mineready-site.xz
            xz -t /tmp/mineready-site.xz
            xz --decompress --stdout /tmp/mineready-site.xz > index.html
            echo 'cac8592c07271d6f03b2bf5090145942200a4f2224115bd5f75a3d07632dafbb  index.html' | sha256sum -c -
          fi

      - name: Write hosting files
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'mineready.zerodaycyber.io' > CNAME
          : > .nojekyll
          cat > health.json <<'JSON'
          {"app":"Zeroday MineReady","status":"ok","version":"9.0.1","deployment":"github-pages"}
          JSON
          cat > manifest.webmanifest <<'JSON'
          {
            "name":"Zeroday MineReady",
            "short_name":"MineReady",
            "start_url":"/",
            "display":"standalone",
            "background_color":"#070b0a",
            "theme_color":"#070b0a",
            "lang":"en"
          }
          JSON
          cat > service-worker.js <<'JS'
          const CACHE='mineready-v9.0.1';
          const ASSETS=['./','./index.html','./manifest.webmanifest','./health.json'];
          self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS)).then(()=>self.skipWaiting())));
          self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim())));
          self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;e.respondWith(fetch(e.request).then(r=>{const copy=r.clone();caches.open(CACHE).then(c=>c.put(e.request,copy));return r}).catch(()=>caches.match(e.request).then(r=>r||caches.match('./index.html'))))});
          JS
          cp index.html 404.html
          cat > README.md <<'MD'
          # Zeroday MineReady

          Mobile-first, bilingual contractor readiness and training demonstration for aggregate and mining sites.

          Production demo URL: `https://mineready.zerodaycyber.io`

          The current release uses fictional demonstration data stored locally in the browser. It is not an authoritative production access-control system.
          MD

      - name: Validate application
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s CNAME
          test -s health.json
          grep -q 'ZERODAY MINEREADY' index.html
          grep -q 'Mine Safety' index.html
          grep -q 'Seguridad de mina' index.html
          grep -q 'Assign training' index.html
          grep -q 'Asignar capacitación' index.html
          test "$(cat CNAME)" = 'mineready.zerodaycyber.io'

      - name: Remove obsolete bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap .payload .release .inspect .repair
          rm -f BOOTSTRAP_DIAGNOSTICS.txt README_TEMP.txt STATUS.md canary.txt test.txt probe2.txt probe3.txt probe4.txt probe5.txt
          rm -f .github/workflows/bootstrap.yml .github/workflows/release-bootstrap.yml

      - name: Commit repaired site to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'release: publish working MineReady Pages site [skip ci]'
            git push origin main
          fi

      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          cp index.html 404.html CNAME .nojekyll health.json manifest.webmanifest service-worker.js _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
