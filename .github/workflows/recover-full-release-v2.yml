name: Recover full MineReady release v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-full-release-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mineready-full-release-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find and extract a coherent historical release snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mineready-candidates /tmp/mineready-release
          mkdir -p /tmp/mineready-candidates /tmp/mineready-release

          try_snapshot() {
            local source_dir="$1"
            local commit="$2"
            local label="$3"
            local work="/tmp/mineready-candidates/${label}"
            rm -rf "${work}"
            mkdir -p "${work}/parts" "${work}/extract"

            mapfile -t paths < <(
              git ls-tree -r --name-only "${commit}" "${source_dir}" \
                | grep -E "^${source_dir//./\.}/part-[0-9]+$" \
                | sort -V || true
            )
            [ "${#paths[@]}" -ge 2 ] || return 1

            for path in "${paths[@]}"; do
              git show "${commit}:${path}" > "${work}/parts/$(basename "${path}")"
            done

            cat "${work}"/parts/part-* | tr -d '\r\n\t ' > "${work}/release.b64"
            base64 --decode "${work}/release.b64" > "${work}/release.tar.xz" 2>/dev/null || return 1
            xz -t "${work}/release.tar.xz" || return 1
            tar -tJf "${work}/release.tar.xz" >/dev/null || return 1
            tar -xJf "${work}/release.tar.xz" -C "${work}/extract"

            root="${work}/extract"
            if [ ! -f "${root}/index.html" ]; then
              nested="$(find "${root}" -mindepth 1 -maxdepth 3 -type f -name index.html -printf '%h\n' | head -n 1 || true)"
              [ -n "${nested}" ] || return 1
              root="${nested}"
            fi

            test -s "${root}/index.html" || return 1
            test -s "${root}/app.js" || return 1
            test -s "${root}/styles.css" || return 1
            test -s "${root}/assets-data.js" || return 1
            test -s "${root}/scripts/verify-static.mjs" || return 1

            rm -rf /tmp/mineready-release
            mkdir -p /tmp/mineready-release
            cp -a "${root}/." /tmp/mineready-release/
            echo "Recovered ${#paths[@]} parts from ${source_dir} at ${commit}"
            sha256sum "${work}/release.tar.xz"
            return 0
          }

          recovered=false
          for source_dir in '.payload/v9' '.release' '.payload' '.bootstrap'; do
            mapfile -t commits < <(git rev-list --all -- "${source_dir}" | awk '!seen[$0]++')
            index=0
            for commit in "${commits[@]}"; do
              label="$(printf '%s-%04d' "${source_dir}" "${index}" | tr '/.' '__')"
              if try_snapshot "${source_dir}" "${commit}" "${label}"; then
                recovered=true
                break 2
              fi
              index=$((index + 1))
            done
          done

          [ "${recovered}" = true ] || {
            echo 'No complete historical MineReady release archive could be reconstructed.' >&2
            exit 1
          }

      - name: Normalize release and create clean publishing workflows
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mineready-release

          printf '%s\n' 'mineready.zerodaycyber.io' > CNAME
          : > .nojekyll
          cat > health.json <<'JSON'
          {
            "app": "Zeroday MineReady",
            "status": "ok",
            "version": "9.2.0",
            "deployment": "github-pages-demo"
          }
          JSON
          cat > robots.txt <<'TXT'
          User-agent: *
          Disallow: /
          TXT

          rm -rf .bootstrap .payload .release .restore-v92 .inspect .repair _site
          rm -f BOOTSTRAP_DIAGNOSTICS.txt PAGES_DEPLOYMENT_STATUS.md README_TEMP.txt STATUS.md
          rm -f canary.txt test.txt probe2.txt probe3.txt probe4.txt probe5.txt
          rm -rf .github/workflows
          mkdir -p .github/workflows

          cat > .github/workflows/validate.yml <<'YAML'
          name: Validate MineReady static release
          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]
            workflow_dispatch:
          permissions:
            contents: read
          jobs:
            validate:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - run: node scripts/verify-static.mjs
                - run: |
                    node --check app.js
                    node --check assets-data.js
                    node --check service-worker.js
                - name: Check release configuration
                  shell: bash
                  run: |
                    set -euo pipefail
                    test "$(tr -d '\r\n' < CNAME)" = 'mineready.zerodaycyber.io'
                    grep -q '"version": "9.2.0"' health.json
                    grep -q 'Disallow: /' robots.txt
          YAML

          cat > .github/workflows/publish-gh-pages.yml <<'YAML'
          name: Publish MineReady site to gh-pages
          on:
            push:
              branches: [main]
            workflow_dispatch:
          permissions:
            contents: write
          concurrency:
            group: mineready-gh-pages-publish
            cancel-in-progress: true
          jobs:
            publish:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Validate release
                  run: |
                    node scripts/verify-static.mjs
                    node --check app.js
                    node --check assets-data.js
                    node --check service-worker.js
                - name: Build site-only artifact
                  shell: bash
                  run: |
                    set -euo pipefail
                    rm -rf _site
                    mkdir -p _site/assets
                    cp index.html 404.html styles.css app.js assets-data.js _site/
                    cp manifest.webmanifest service-worker.js health.json CNAME .nojekyll robots.txt _site/
                    cp -a assets/. _site/assets/
                - name: Publish gh-pages branch
                  uses: peaceiris/actions-gh-pages@v4
                  with:
                    github_token: ${{ secrets.GITHUB_TOKEN }}
                    publish_dir: ./_site
                    publish_branch: gh-pages
                    force_orphan: true
                    enable_jekyll: false
                    cname: mineready.zerodaycyber.io
          YAML

          cat > README.md <<'MD'
          # Zeroday MineReady

          Mobile-first English/Spanish contractor-readiness, training, and gate-verification demonstration for aggregate and mining sites.

          ## GitHub Pages

          - Publishing branch: `gh-pages`
          - Folder: `/(root)`
          - Custom domain: `mineready.zerodaycyber.io`
          - DNS: `mineready CNAME zeross11.github.io`

          Pushes to `main` validate and publish only the site files to `gh-pages`. This demonstration uses fictional data stored locally in each browser and is not a production system of record.
          MD

          cat > DEPLOYMENT.md <<'MD'
          # Deployment

          In **Settings → Pages**, choose **Deploy from a branch**, then select `gh-pages` and `/(root)`. Set the custom domain to `mineready.zerodaycyber.io`.

          Create a DNS-only CNAME at the authoritative DNS provider:

          - Host: `mineready`
          - Target: `zeross11.github.io`

          After GitHub validates DNS and provisions its certificate, enable **Enforce HTTPS**.
          MD

          cat > DNS_SETUP.md <<'MD'
          # DNS

          `mineready CNAME zeross11.github.io`

          Do not include `https://` or `/zeroday-mineready`. With Cloudflare, keep the record DNS-only until GitHub finishes TLS provisioning.
          MD

      - name: Validate full recovered application
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mineready-release
          node scripts/verify-static.mjs
          node --check app.js
          node --check assets-data.js
          node --check service-worker.js
          test -s assets-data.js
          test "$(tr -d '\r\n' < CNAME)" = 'mineready.zerodaycyber.io'
          grep -q '"version": "9.2.0"' health.json
          grep -q 'English/Spanish' README.md

      - name: Replace repository with clean release
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/mineready-release/. .

      - name: Commit clean release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: restore full MineReady v9.2.0 customer demo'
          git push origin HEAD:main
