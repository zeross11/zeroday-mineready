name: Deploy MineReady to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate required site files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            index.html
            404.html
            styles.css
            data.js
            views.js
            app.js
            manifest.webmanifest
            service-worker.js
            health.json
            CNAME
            .nojekyll
            assets/icon.svg
          )
          for file in "${required[@]}"; do
            test -e "$file" || { echo "Missing required file: $file" >&2; exit 1; }
          done
          test -s index.html
          test -s styles.css
          test -s data.js
          test -s views.js
          test -s app.js
          test "$(tr -d '\r\n' < CNAME)" = "mineready.zerodaycyber.io"
          grep -q 'styles.css' index.html
          grep -q 'data.js' index.html
          grep -q 'views.js' index.html
          grep -q 'app.js' index.html

      - name: Validate JavaScript syntax
        run: |
          node --check data.js
          node --check views.js
          node --check app.js
          node --check service-worker.js

      - name: Build clean Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/assets
          cp index.html 404.html styles.css data.js views.js app.js _site/
          cp manifest.webmanifest service-worker.js health.json CNAME .nojekyll _site/
          cp -a assets/. _site/assets/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
