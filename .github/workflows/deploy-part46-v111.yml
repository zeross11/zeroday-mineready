name: Deploy MineReady 11.1 Part 46 release

on:
  push:
    branches: [main]
    paths:
      - '.deploy-v111/READY'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mineready-part46-v111-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reconstruct verified release
        shell: bash
        run: |
          set -euo pipefail
          test -f .deploy-v111/READY
          test "$(find .deploy-v111 -maxdepth 1 -type f -name 'part-*' | wc -l | tr -d ' ')" = "8"
          find .deploy-v111 -maxdepth 1 -type f -name 'part-*' -print0 | sort -z -V | xargs -0 cat > /tmp/mineready-v111.b64
          base64 --decode /tmp/mineready-v111.b64 > /tmp/mineready-v111.tar.xz
          echo '87a5b2e6ac34441c51fedb3b91a4482e58762398f753ddf1e1ff92bcfac8fa3d  /tmp/mineready-v111.tar.xz' | sha256sum -c -
          xz -t /tmp/mineready-v111.tar.xz
          rm -rf /tmp/mineready-v111
          mkdir -p /tmp/mineready-v111
          tar -xJf /tmp/mineready-v111.tar.xz -C /tmp/mineready-v111

      - name: Static, security, and Part 46 validation
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mineready-v111
          test -s index.html
          test -s health.json
          test -s assets/logo.png
          test "$(tr -d '\r\n' < CNAME)" = 'mineready.zerodaycyber.io'
          grep -q 'data-version="11.1.0"' index.html
          grep -q "VERSION='11.1.0'" index.html
          grep -q '§46.5 New Miner' index.html
          grep -q '§46.6 Newly Hired Experienced Miner' index.html
          grep -q '§46.8 Annual Refresher' index.html
          grep -q 'Changes at the Mine' index.html
          grep -q 'Incident Prevention' index.html
          grep -q 'Incident Response' index.html
          grep -q 'w.preWorkComplete=w.preWorkMinutes>=240' index.html
          grep -q 'w.preWorkSubjectsComplete>=7' index.html
          grep -q "a.status='awaiting_review'" index.html
          grep -q "a.status='certified'" index.html
          ! grep -q 'serviceWorker.register' index.html
          ! grep -Eq 'https?://[^" ]+\.(js|css)' index.html
          python - <<'PY'
          from pathlib import Path
          import re, json
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>([\s\S]*?)</script>',html)
          if len(scripts)!=1: raise SystemExit(f'expected one inline app script, found {len(scripts)}')
          Path('/tmp/app-v111.js').write_text(scripts[0],encoding='utf-8')
          for ref in re.findall(r"['\"](\./assets/[^'\"]+)['\"]",html):
              path=Path(ref[2:])
              if not path.is_file(): raise SystemExit(f'missing local asset: {path}')
          health=json.loads(Path('health.json').read_text())
          assert health['version']=='11.1.0' and health['part46_ledger'] is True
          print('Local assets and release metadata verified')
          PY
          node --check /tmp/app-v111.js

      - name: Replace repository with clean release
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/mineready-v111/. .
          git status --short

      - name: Commit and publish identical source and Pages branches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: deploy MineReady 11.1 Part 46 training ledger'
          git push origin HEAD:main
          git push origin HEAD:gh-pages --force
