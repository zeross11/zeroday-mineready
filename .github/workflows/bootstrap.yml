name: Bootstrap MineReady release

on:
  push:
    branches: [main]
    paths:
      - '.payload/v9/**'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mineready-bootstrap
  cancel-in-progress: false

jobs:
  unpack-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and validate staged release
        shell: bash
        run: |
          set -uo pipefail
          DIAG="$GITHUB_WORKSPACE/BOOTSTRAP_DIAGNOSTICS.txt"
          ARCHIVE=/tmp/mineready-repo.tar.xz
          B64=/tmp/mineready-repo.b64
          EXTRACT=/tmp/mineready-release

          {
            echo "MineReady bootstrap diagnostics"
            echo "Run: $GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo "UTC: $(date -u +%FT%TZ)"
            echo
            echo "Staged files:"
            find .payload/v9 -maxdepth 1 -type f -printf '%f %s bytes\n' 2>&1 | sort
          } > "$DIAG"

          if ! test -f .payload/v9/READY; then
            echo "ERROR: .payload/v9/READY is missing" >> "$DIAG"
            exit 20
          fi

          mapfile -t PARTS < <(find .payload/v9 -maxdepth 1 -type f -name 'part-*' -print | sort)
          echo "Part count: ${#PARTS[@]}" >> "$DIAG"
          if [ "${#PARTS[@]}" -lt 2 ]; then
            echo "ERROR: insufficient release parts" >> "$DIAG"
            exit 21
          fi

          cat "${PARTS[@]}" > "$B64"
          echo "Combined base64 bytes: $(wc -c < "$B64")" >> "$DIAG"

          if ! base64 --decode "$B64" > "$ARCHIVE" 2>> "$DIAG"; then
            echo "ERROR: base64 decoding failed" >> "$DIAG"
            exit 22
          fi

          echo "Archive bytes: $(wc -c < "$ARCHIVE")" >> "$DIAG"
          echo "Archive SHA256: $(sha256sum "$ARCHIVE" | awk '{print $1}')" >> "$DIAG"

          if ! xz -t "$ARCHIVE" 2>> "$DIAG"; then
            echo "ERROR: XZ integrity test failed" >> "$DIAG"
            exit 23
          fi

          if ! tar -tJf "$ARCHIVE" >> "$DIAG" 2>&1; then
            echo "ERROR: TAR listing failed" >> "$DIAG"
            exit 24
          fi

          rm -rf "$EXTRACT"
          mkdir -p "$EXTRACT"
          if ! tar -xJf "$ARCHIVE" -C "$EXTRACT" 2>> "$DIAG"; then
            echo "ERROR: archive extraction failed" >> "$DIAG"
            exit 25
          fi

          for required in index.html app.js styles.css assets-data.js service-worker.js manifest.webmanifest .github/workflows/deploy-pages.yml; do
            if [ ! -f "$EXTRACT/$required" ]; then
              echo "ERROR: required release file missing: $required" >> "$DIAG"
              exit 26
            fi
          done

          echo "VALIDATION: staged release archive is complete" >> "$DIAG"

      - name: Record diagnostic when reconstruction fails
        if: failure()
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BOOTSTRAP_DIAGNOSTICS.txt
          git commit -m 'chore: record MineReady bootstrap failure [skip ci]' || true
          git push origin main || true

      - name: Replace staging files with application release
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/mineready-release/. .

      - name: Validate application
        run: node scripts/verify-static.mjs

      - name: Commit release to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: deploy MineReady v9.0.1 to GitHub Pages'
          git push origin main
