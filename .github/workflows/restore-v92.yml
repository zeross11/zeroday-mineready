name: Restore MineReady v9.2 release

on:
  push:
    branches: [main]
    paths:
      - '.restore-v92/READY'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mineready-v92-restore
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify clean release
        shell: bash
        run: |
          set -euo pipefail
          test -f .restore-v92/READY
          cat .restore-v92/part-* > /tmp/mineready-clean.b64
          base64 --decode /tmp/mineready-clean.b64 > /tmp/mineready-clean.tar.xz
          echo '938538232de77434641036b3b62a098d1b2446894357808581f54ee06c54b175  /tmp/mineready-clean.tar.xz' | sha256sum -c -
          rm -rf /tmp/mineready-clean
          mkdir -p /tmp/mineready-clean
          tar -xJf /tmp/mineready-clean.tar.xz -C /tmp/mineready-clean
          cd /tmp/mineready-clean
          node scripts/verify-static.mjs
          node --check app.js
          node --check assets-data.js
          node --check service-worker.js

      - name: Replace recovery build with clean full release
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/mineready-clean/. .
          node scripts/verify-static.mjs

      - name: Commit restored release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: restore full MineReady v9.2.0 application'
          git push origin main
