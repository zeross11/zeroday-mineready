name: Deploy MineReady 10.2 mobile compatibility release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mineready-v102-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reconstruct and validate release
        shell: bash
        run: |
          set -euo pipefail
          test -f .deploy-v102/READY
          test "$(find .deploy-v102 -maxdepth 1 -type f -name 'part-*' | wc -l | tr -d ' ')" = "6"
          find .deploy-v102 -maxdepth 1 -type f -name 'part-*' -print0 | sort -z -V | xargs -0 cat > /tmp/mineready-v102.b64
          base64 --decode /tmp/mineready-v102.b64 > /tmp/mineready-v102.html.xz
          echo 'acdd47b3c023aa0f0457f3bebdbb4406113dd817f8203f9c942ac5ccc57ff238  /tmp/mineready-v102.html.xz' | sha256sum -c -
          xz -t /tmp/mineready-v102.html.xz
          xz -dc /tmp/mineready-v102.html.xz > /tmp/index.html
          echo '5b2b24ba159001405f5d68c657d6a1f2040cccbfbbc3eb86ecd957dad606b6be  /tmp/index.html' | sha256sum -c -
          grep -q 'data-version="10.2.0"' /tmp/index.html
          grep -q "var VERSION='10.2.0'" /tmp/index.html
          grep -q 'Fictional demonstration data' /tmp/index.html
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('/tmp/index.html', 'utf8');
          const match = html.match(/<script>([\s\S]*)<\/script>/);
          if (!match) throw new Error('Inline application script not found');
          new Function(match[1]);
          if (/\?\.|\?\?|=>/.test(match[1])) throw new Error('Unsupported modern JavaScript syntax remains');
          console.log('Inline JavaScript parsed successfully in compatibility mode');
          NODE

      - name: Replace repository with clean mobile release
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/index.html index.html
          cat > service-worker.js <<'JS'
          self.addEventListener('install',function(){self.skipWaiting();});
          self.addEventListener('activate',function(event){event.waitUntil(caches.keys().then(function(keys){return Promise.all(keys.map(function(key){return caches.delete(key);}));}).then(function(){return self.registration.unregister();}).then(function(){return self.clients.matchAll({type:'window'});}).then(function(clients){clients.forEach(function(client){client.navigate(client.url);});}));});
          JS
          cat > 404.html <<'HTML'
          <!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=/?from=404"><title>Opening MineReady</title><p><a href="/">Open MineReady</a></p>
          HTML
          cat > health.json <<'JSON'
          {"app":"Zeroday MineReady","status":"ok","version":"10.2.0","deployment":"github-pages-live","architecture":"single-file-mobile","service_worker":"disabled"}
          JSON
          printf '%s\n' 'mineready.zerodaycyber.io' > CNAME
          : > .nojekyll
          printf '%s\n' 'User-agent: *' 'Disallow: /' > robots.txt
          cat > README.md <<'MD'
          # Zeroday MineReady

          Mobile-first English/Spanish contractor-readiness, training, mine-approval, and gate-verification demonstration for aggregate and mining sites.

          ## Release 10.2.0

          - One self-contained HTML application
          - No external JavaScript or CSS dependencies
          - No active service worker or application-shell cache
          - Broad mobile-browser-compatible JavaScript
          - Mine, employer, and worker workspaces
          - Assignable bilingual training with phone completion
          - Authorized employer or mine review before a record becomes current
          - Assignment-specific mine approval and check-in
          - Safe CSV import/export
          - Fictional browser-local data only

          Live demo: `https://mineready.zerodaycyber.io`

          This public demonstration is not an authoritative production system, regulated training curriculum, or live access-control system.
          MD
          cat > QA_REPORT.md <<'MD'
          # MineReady 10.2 QA

          The release was exercised before deployment at 320x568, 390x844, 820x1180, and 1440x1000. It rendered without startup errors or horizontal overflow. English and Spanish were tested. The end-to-end mobile workflow passed: employer assignment, worker lesson and quiz completion, employer certification, mine approval, and check-in.
          MD
          cat > SECURITY.md <<'MD'
          # Security boundary

          MineReady 10.2 is a public demonstration using fictional data stored in each browser. Do not enter real worker identity, training, credential, safety, or mine-access data. Production use requires authentication, tenant isolation, a secured backend, server-side audit logging, backup, and formal regulatory review.
          MD

      - name: Final static validation
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s service-worker.js
          test "$(tr -d '\r\n' < CNAME)" = 'mineready.zerodaycyber.io'
          grep -q '"version":"10.2.0"' health.json
          grep -q "var VERSION='10.2.0'" index.html
          ! grep -q 'bootstrap.js' index.html
          ! grep -q 'hardening.js' index.html
          ! grep -q 'serviceWorker.register' index.html

      - name: Commit and publish identical main and gh-pages branches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: deploy MineReady 10.2 mobile compatibility build'
          git push origin HEAD:main
          git push origin HEAD:gh-pages --force
