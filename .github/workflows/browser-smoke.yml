name: One-time MineReady browser smoke test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v5

      - name: Check JavaScript syntax
        id: syntax
        continue-on-error: true
        run: |
          node --check bootstrap.js
          node --check data.js
          node --check views.js
          node --check app.js
          node --check hardening.js
          node --check service-worker.js

      - name: Install headless browser
        id: install
        continue-on-error: true
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run phone and desktop browser tests
        id: browser
        if: steps.syntax.outcome == 'success' && steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/mineready-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill ${SERVER_PID} 2>/dev/null || true' EXIT
          sleep 2
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const errors = [];
            const test = async (url, viewport, expected) => {
              const page = await browser.newPage({ viewport });
              page.on('pageerror', error => errors.push(`pageerror: ${error.message}`));
              page.on('console', message => { if (message.type() === 'error') errors.push(`console: ${message.text()}`); });
              await page.goto(url, { waitUntil: 'networkidle', timeout: 30000 });
              await page.waitForSelector('.shell', { timeout: 10000 });
              const text = await page.locator('#app').innerText();
              if (text.trim().length < 100) throw new Error(`Rendered text too short: ${text.length}`);
              for (const token of expected) {
                if (!text.includes(token)) throw new Error(`Missing expected text: ${token}`);
              }
              const overflow = await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth + 1);
              if (overflow) throw new Error('Horizontal overflow detected');
              await page.close();
            };
            await test('http://127.0.0.1:4173/?workspace=mine&lang=en', { width: 390, height: 844 }, ['MineReady', 'Today']);
            await test('http://127.0.0.1:4173/?workspace=worker&worker=ZMR-1042&lang=es', { width: 390, height: 844 }, ['MineReady', 'Inicio']);
            await test('http://127.0.0.1:4173/?workspace=employer&lang=en', { width: 1365, height: 900 }, ['MineReady', 'Employer']);
            await browser.close();
            if (errors.length) throw new Error(errors.join('\n'));
            console.log('MineReady browser smoke test passed.');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Record smoke-test result
        if: always()
        env:
          SYNTAX: ${{ steps.syntax.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
        shell: bash
        run: |
          cat > BROWSER_SMOKE_STATUS.json <<EOF
          {
            "release": "9.3.3",
            "syntax": "${SYNTAX}",
            "browser_install": "${INSTALL}",
            "browser_render": "${BROWSER}",
            "run": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "commit": "${GITHUB_SHA}"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BROWSER_SMOKE_STATUS.json
          git commit -m 'test: record MineReady browser smoke result [skip ci]' || true
          git push origin HEAD:main

      - name: Fail if the application did not render
        if: steps.syntax.outcome != 'success' || steps.install.outcome != 'success' || steps.browser.outcome != 'success'
        run: exit 1
