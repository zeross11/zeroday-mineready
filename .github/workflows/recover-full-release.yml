name: Recover full MineReady release from repository history

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-full-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mineready-full-release-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover the last complete release archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mineready-candidates /tmp/mineready-release
          mkdir -p /tmp/mineready-candidates /tmp/mineready-release

          recover_candidate() {
            local source_dir="$1"
            local label="$2"
            local work="/tmp/mineready-candidates/${label}"
            mkdir -p "${work}/parts" "${work}/extract"

            mapfile -t paths < <(
              git log --all --name-only --pretty=format: -- "${source_dir}" \
                | sed '/^$/d' \
                | grep -E "^${source_dir//./\.}/part-[0-9]+$" \
                | sort -V -u || true
            )

            if [ "${#paths[@]}" -lt 2 ]; then
              echo "No usable historical parts found under ${source_dir}"
              return 1
            fi

            echo "Recovering ${#paths[@]} historical parts from ${source_dir}"
            for path in "${paths[@]}"; do
              commit="$(git log --all -1 --format=%H -- "${path}")"
              test -n "${commit}"
              git show "${commit}:${path}" > "${work}/parts/$(basename "${path}")"
            done

            cat "${work}"/parts/part-* | tr -d '\r\n\t ' > "${work}/release.b64"
            base64 --decode "${work}/release.b64" > "${work}/release.tar.xz" 2>/dev/null || return 1
            xz -t "${work}/release.tar.xz" || return 1
            tar -tJf "${work}/release.tar.xz" >/dev/null || return 1
            tar -xJf "${work}/release.tar.xz" -C "${work}/extract"

            root="${work}/extract"
            if [ ! -f "${root}/index.html" ]; then
              nested="$(find "${root}" -mindepth 1 -maxdepth 2 -type f -name index.html -printf '%h\n' | head -n 1 || true)"
              test -n "${nested}" || return 1
              root="${nested}"
            fi

            test -s "${root}/index.html" || return 1
            test -s "${root}/app.js" || return 1
            test -s "${root}/styles.css" || return 1
            test -s "${root}/assets-data.js" || return 1
            test -s "${root}/scripts/verify-static.mjs" || return 1

            rm -rf /tmp/mineready-release
            mkdir -p /tmp/mineready-release
            cp -a "${root}/." /tmp/mineready-release/
            sha256sum "${work}/release.tar.xz"
            echo "Recovered complete release from ${source_dir}"
            return 0
          }

          recovered=false
          for candidate in '.payload/v9' '.release' '.payload' '.bootstrap'; do
            label="$(printf '%s' "${candidate}" | tr '/.' '__')"
            if recover_candidate "${candidate}" "${label}"; then
              recovered=true
              break
            fi
          done

          if [ "${recovered}" != true ]; then
            echo 'Unable to recover a complete MineReady archive from repository history.' >&2
            exit 1
          fi

      - name: Harden and normalize the recovered URL release
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mineready-release

          printf '%s\n' 'mineready.zerodaycyber.io' > CNAME
          : > .nojekyll
          cat > health.json <<'JSON'
          {
            "app": "Zeroday MineReady",
            "status": "ok",
            "version": "9.2.0",
            "deployment": "github-pages-demo"
          }
          JSON
          cat > robots.txt <<'TXT'
          User-agent: *
          Disallow: /
          TXT

          if [ -f service-worker.js ]; then
            sed -i -E "s/mineready-v[0-9.]+[^']*/mineready-v9.2.0-github-pages/g" service-worker.js || true
          fi

          rm -rf .bootstrap .payload .release .restore-v92 .inspect .repair
          rm -rf _site
          rm -f BOOTSTRAP_DIAGNOSTICS.txt PAGES_DEPLOYMENT_STATUS.md README_TEMP.txt STATUS.md
          rm -f canary.txt test.txt probe2.txt probe3.txt probe4.txt probe5.txt
          rm -rf .github/workflows
          mkdir -p .github/workflows

          cat > .github/workflows/validate.yml <<'YAML'
          name: Validate MineReady static release

          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            validate:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Verify required static assets
                  run: node scripts/verify-static.mjs
                - name: Check JavaScript syntax
                  run: |
                    node --check app.js
                    node --check assets-data.js
                    node --check service-worker.js
                - name: Confirm custom-domain release configuration
                  shell: bash
                  run: |
                    set -euo pipefail
                    test "$(tr -d '\r\n' < CNAME)" = 'mineready.zerodaycyber.io'
                    grep -q '"version": "9.2.0"' health.json
                    grep -q 'Disallow: /' robots.txt
          YAML

          cat > .github/workflows/publish-gh-pages.yml <<'YAML'
          name: Publish MineReady site to gh-pages

          on:
            push:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: write

          concurrency:
            group: mineready-gh-pages-publish
            cancel-in-progress: true

          jobs:
            publish:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Validate release
                  run: |
                    node scripts/verify-static.mjs
                    node --check app.js
                    node --check assets-data.js
                    node --check service-worker.js
                - name: Build site-only artifact
                  shell: bash
                  run: |
                    set -euo pipefail
                    rm -rf _site
                    mkdir -p _site/assets
                    cp index.html 404.html styles.css app.js assets-data.js _site/
                    cp manifest.webmanifest service-worker.js health.json CNAME .nojekyll robots.txt _site/
                    cp -a assets/. _site/assets/
                - name: Publish gh-pages branch
                  uses: peaceiris/actions-gh-pages@v4
                  with:
                    github_token: ${{ secrets.GITHUB_TOKEN }}
                    publish_dir: ./_site
                    publish_branch: gh-pages
                    force_orphan: true
                    enable_jekyll: false
                    cname: mineready.zerodaycyber.io
          YAML

          cat > README.md <<'MD'
          # Zeroday MineReady

          Mobile-first English/Spanish contractor-readiness, training, and gate-verification demonstration for aggregate and mining sites.

          ## GitHub Pages publishing

          - Source branch: `gh-pages`
          - Folder: `/(root)`
          - Custom domain: `mineready.zerodaycyber.io`
          - DNS record: `mineready CNAME zeross11.github.io`

          Pushes to `main` are validated and publish only the site files to `gh-pages`. The demonstration uses fictional data stored locally in each browser and is not a production system of record.
          MD

          cat > DEPLOYMENT.md <<'MD'
          # MineReady deployment

          In GitHub, open **Settings → Pages** and select **Deploy from a branch**, then choose `gh-pages` and `/(root)`. Set the custom domain to `mineready.zerodaycyber.io`.

          At the authoritative DNS provider, create a DNS-only CNAME record:

          - Host: `mineready`
          - Target: `zeross11.github.io`

          After GitHub validates DNS and provisions TLS, enable **Enforce HTTPS**.
          MD

          cat > DNS_SETUP.md <<'MD'
          # DNS record

          `mineready CNAME zeross11.github.io`

          Do not include `https://` or `/zeroday-mineready`. If Cloudflare manages DNS, keep the record DNS-only until GitHub finishes certificate provisioning.
          MD

      - name: Validate recovered full application
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mineready-release
          node scripts/verify-static.mjs
          node --check app.js
          node --check assets-data.js
          node --check service-worker.js
          test -s assets-data.js
          test "$(tr -d '\r\n' < CNAME)" = 'mineready.zerodaycyber.io'
          grep -q '"version": "9.2.0"' health.json
          grep -q 'English' README.md
          grep -q 'Spanish' README.md

      - name: Replace temporary repository contents with the clean release
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/mineready-release/. .

      - name: Commit and push clean MineReady v9.2.0
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: restore full MineReady v9.2.0 customer demo'
          git push origin HEAD:main
