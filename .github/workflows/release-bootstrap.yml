name: Install verified MineReady release

on:
  push:
    branches: [main]
    paths:
      - '.release/READY'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mineready-release-install
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified release
        shell: bash
        run: |
          set -euo pipefail
          test -f .release/READY
          test -f .release/part-000
          cat .release/part-* > /tmp/mineready-release.b64
          base64 --decode /tmp/mineready-release.b64 > /tmp/mineready-release.tar.xz
          echo "a2b3640564292af9dcefbc81a2bab55d96072f68a21355ca95db2b5eda71c417  /tmp/mineready-release.tar.xz" | sha256sum -c -
          rm -rf /tmp/mineready-release
          mkdir -p /tmp/mineready-release
          tar -xJf /tmp/mineready-release.tar.xz -C /tmp/mineready-release
          test -f /tmp/mineready-release/index.html
          test -f /tmp/mineready-release/.github/workflows/deploy-pages.yml

      - name: Replace bootstrap files with application release
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/mineready-release/. .

      - name: Validate application
        run: node scripts/verify-static.mjs

      - name: Commit release to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: deploy MineReady v9.0.1 to GitHub Pages'
          git push origin main
