<!doctype html>
<html lang="en" data-app-version="11.1.0">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070a07">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-src 'none'; upgrade-insecure-requests">
  <meta name="description" content="MineReady mobile Part 46 training ledger, workforce readiness, and gate-verification demonstration">
  <title>Zeroday MineReady</title>
  <link rel="icon" href="./assets/icon.svg?v=11.1.0" type="image/svg+xml">
  <link rel="stylesheet" href="./mineready-v111.css?v=11.1.0">
</head>
<body>
  <div id="app">
    <main class="boot" role="status" aria-live="polite">
      <div>
        <img src="./assets/icon.svg?v=11.1.0" alt="Zeroday">
        <h1>Zeroday MineReady</h1>
        <p>Opening the Part 46 mine-safety workspace…</p>
        <a href="?reset=1">Reset local demo data</a>
        <noscript><p>JavaScript is required for this interactive demonstration.</p></noscript>
      </div>
    </main>
  </div>
  <div id="modal" class="modal" hidden><div class="modal-card"><button class="close" data-action="modal-close" aria-label="Close">×</button><div id="modalBody"></div></div></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    (function(){
      function fail(message){var app=document.getElementById('app');if(!app||app.querySelector('.app'))return;app.innerHTML='<main class="boot" role="alert"><div><img src="./assets/icon.svg?v=11.1.0" alt="Zeroday"><h1>MineReady could not start</h1><p>'+String(message||'Application file did not load').replace(/[<>]/g,'')+'</p><a href="?reset=1">Reset demo and reload</a></div></main>';}
      window.MR_START_FAIL=fail;
      window.addEventListener('error',function(event){fail(event&&event.message);});
      window.addEventListener('unhandledrejection',function(){fail('Application startup error');});
      try{if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)navigator.serviceWorker.getRegistrations().then(function(list){list.forEach(function(reg){reg.unregister();});});if(window.caches)caches.keys().then(function(keys){keys.forEach(function(key){if(key.indexOf('mineready-')===0)caches.delete(key);});});}catch(e){}
      window.setTimeout(function(){if(!document.querySelector('.app'))fail('Startup timed out.');},8000);
    })();
  </script>
  <script src="./mineready-v111.js?v=11.1.0" onerror="MR_START_FAIL('MineReady application file did not load')"></script>
</body>
</html>
