<!doctype html>
<html lang="en" data-app-version="9.3.4">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070a07">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-src 'none'; upgrade-insecure-requests">
  <meta name="description" content="MineReady contractor readiness, bilingual training, and gate verification demonstration">
  <title>Zeroday MineReady</title>
  <link rel="manifest" href="./manifest.webmanifest?v=9.3.4">
  <link rel="icon" href="./assets/icon.svg?v=9.3.4" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=9.3.4">
  <link rel="stylesheet" href="./hardening.css?v=9.3.4">
  <style>
    .mr-boot{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#080b08;color:#f4f7f2;text-align:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.mr-boot-box{max-width:430px}.mr-boot-mark{width:70px;height:70px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;border:1px solid #355421;border-radius:18px;background:#050705;color:#99ed2d;font-size:28px;font-weight:950;letter-spacing:-3px}.mr-boot h1{margin:0 0 8px;font-size:29px}.mr-boot p{margin:0;color:#9eaa9a;line-height:1.55}.mr-boot button{margin-top:18px;min-height:46px;border:1px solid #99ed2d;border-radius:12px;background:#99ed2d;color:#071006;padding:10px 16px;font-weight:850}.mr-boot small{display:block;margin-top:14px;color:#ffb2ac;word-break:break-word}
  </style>
</head>
<body>
  <div id="app"><main class="mr-boot" role="status" aria-live="polite"><div class="mr-boot-box"><div class="mr-boot-mark">09</div><h1>Zeroday MineReady</h1><p>Opening the mine-safety workspace…</p></div></main></div>
  <div id="modal" class="modal" hidden><div class="modal-card"><button class="close" data-action="close" aria-label="Close">×</button><div id="modalBody"></div></div></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
  (function(){
    'use strict';
    var VERSION='9.3.4', app=document.getElementById('app'), failed=false;
    function safe(value){return String(value==null?'':value).replace(/[<>]/g,'').slice(0,260);}
    function cleanup(){
      try{localStorage.removeItem('mineready-bootstrap-schema');}catch(e){}
      try{if(window.caches)caches.keys().then(function(keys){for(var i=0;i<keys.length;i++)if(keys[i].indexOf('mineready-')===0)caches.delete(keys[i]);});}catch(e2){}
      try{if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)navigator.serviceWorker.getRegistrations().then(function(list){for(var i=0;i<list.length;i++)list[i].unregister();});}catch(e3){}
    }
    function showError(detail){
      if(failed||document.querySelector('.shell'))return;failed=true;
      app.innerHTML='<main class="mr-boot" role="alert"><div class="mr-boot-box"><div class="mr-boot-mark">09</div><h1>MineReady could not start</h1><p>The browser received an incomplete or outdated application file. Reset the local demo data and reload the current release.</p><button id="mrReset" type="button">Reset and reload</button><small>'+safe(detail)+'</small></div></main>';
      var button=document.getElementById('mrReset');
      if(button)button.onclick=function(){
        try{localStorage.removeItem('mineready-recovery-v1');localStorage.removeItem('mineready-demo-schema');localStorage.removeItem('mineready-bootstrap-schema');}catch(e){}
        cleanup();location.replace(location.pathname+'?reset='+new Date().getTime());
      };
    }
    window.MR_BOOT_FAIL=showError;
    window.addEventListener('error',function(event){showError((event&&event.message)||'Application script error');});
    window.addEventListener('unhandledrejection',function(event){showError((event&&event.reason&&event.reason.message)||'Application startup error');});
    cleanup();
    window.setTimeout(function(){if(!document.querySelector('.shell'))showError('Startup timed out. Release '+VERSION);},8000);
  })();
  </script>
  <script src="./data.js?v=9.3.4" onerror="MR_BOOT_FAIL('data.js did not load')"></script>
  <script src="./views.js?v=9.3.4" onerror="MR_BOOT_FAIL('views.js did not load')"></script>
  <script src="./app.js?v=9.3.4" onerror="MR_BOOT_FAIL('app.js did not load')"></script>
  <script src="./hardening.js?v=9.3.4" onerror="MR_BOOT_FAIL('hardening.js did not load')"></script>
</body>
</html>
